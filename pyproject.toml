# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grokmirror"
description = "Smartly mirror git repositories that use grokmirror"
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Konstantin Ryabitsev", email = "konstantin@linuxfoundation.org" }
]
keywords = ["git", "mirroring", "repositories"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Archiving :: Mirroring",
]
dependencies = [
    "packaging",
    "requests",
    "urllib3",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://git.kernel.org/pub/scm/utils/grokmirror/grokmirror.git"
Repository = "https://git.kernel.org/pub/scm/utils/grokmirror/grokmirror.git"
Tracker = "https://github.com/mricon/grokmirror/issues"

[project.scripts]
grok-bundle = "grokmirror.bundle:command"
grok-dumb-pull = "grokmirror.dumb_pull:command"
grok-fsck = "grokmirror.fsck:command"
grok-manifest = "grokmirror.manifest:command"
grok-pi-indexer = "grokmirror.pi_indexer:command"
grok-pi-piper = "grokmirror.pi_piper:command"
grok-pull = "grokmirror.pull:command"

[dependency-groups]
dev = [
    "build",
    # Only needed so the type checkers can see contrib/pubsubv1.py, which is an
    # optional listener frontend and not a grokmirror runtime dependency.
    "falcon",
    "mypy",
    "pyright",
    "pytest",
    # The repo-fixture tests spend most of their time waiting on git and on
    # grok-pull's worker poll intervals, so they parallelize almost perfectly.
    "pytest-xdist",
    "ruff",
    "ty",
    "types-requests",
]

[tool.setuptools.packages.find]
# src layout: nothing at the top level is importable, so a stale build/ tree or
# the cwd can't shadow the real package during tests and type checking.
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "grokmirror.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -n auto --dist worksteal"

[tool.mypy]
# Not yet `strict = true`, but every function in the tree is annotated now and
# no bare `dict`/`list`/`Queue` annotations are left, so disallow_untyped_defs,
# disallow_untyped_calls and disallow_any_generics all apply to the whole tree.
# See the top of ci.sh for the plan.
# python_version is deliberately unset: mypy no longer accepts a 3.9 target, so
# it checks against whatever interpreter it runs under. ruff, pyright and ty are
# all still pinned to py39, and ci-matrix.sh actually runs the tests on 3.9.
#
# The src layout keeps stray copies of the package out of mypy's way, but a
# build/ tree left behind by an older build backend would still collide with
# src/grokmirror and make mypy refuse to check anything at all.
exclude = ['^build/']
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_any_generics = true

[tool.pyright]
# pyright automatically ignores virtual environments and other directories, but
# once we specify `exclude`, we're on our own. The matrix in ci-matrix.sh
# creates .venv-<version> environments, so match them all. See
# https://github.com/microsoft/pyright/issues/9057#issuecomment-2366938099.
exclude = [".venv*"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.ty.rules]
# `all = "error"` (as in liblore) once the annotation backlog is paid down.

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# explicit-preview-rules means a family selection ("FURB") still enables only
# its stable rules; preview rules are opted into one by one, by exact code.
preview = true
explicit-preview-rules = true
extend-select = [
    "ARG",
    "B904", # raise inside except must use "from" to keep the original cause
    "FURB",
    "FURB101", # read-whole-file: open()+read() -> Path.read_text/read_bytes
    "FURB103", # write-whole-file: open()+write() -> Path.write_text/write_bytes
    "FURB113", # repeated-append -> one extend()
    "I",
    "PLW1514", # unspecified-encoding: text-mode I/O must say encoding=
]

[tool.ruff.lint.isort]
known-first-party = ["grokmirror"]
# tests/support.py is imported by module name, since tests/ is not a package.
known-local-folder = ["support"]

[tool.ruff.format]
quote-style = "single"
